spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/api_dev
    username: postgres
    password:
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=100,expireAfterWrite=10m

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:mySecretKeyForJWTTokenGenerationThatIsAtLeast256BitsLong12345}
  access-token-expiration: 900000
  refresh-token-expiration: 86400000

rate-limit:
  enabled: false

cors:
  allowed-origins: https://yourdomain.com,http://localhost:3000
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  max-age: 3600

affiliate:
  tracking:
    enabled: true

logging:
  file:
    name: logs/api-dev.log
  level:
    root: INFO
    com.plants.api: DEBUG

management:
  health:
    redis:
      enabled: false
