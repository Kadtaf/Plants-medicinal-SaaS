spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

jwt:
  secret: test-secret-key-123456789012345678901234567890
  access-token-expiration: 900000
  refresh-token-expiration: 86400000

logging:
  level:
    root: WARN

rate-limit:
  enabled: false
